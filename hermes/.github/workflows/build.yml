name: HERMES Build
on:
  push:
    paths: ['hermes/**']
  pull_request:
    paths: ['hermes/**']

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: pytest -q

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes/apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
